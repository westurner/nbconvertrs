[package]
name = "nbconvertrs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "BSD-2-Clause"
description = "Optional Markdown and Jupyter notebook transforms for DocIndex"

[[bin]]
name = "transform-md"
path = "src/transform_md.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
nbformat = { workspace = true }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"